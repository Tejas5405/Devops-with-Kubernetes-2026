apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todo-app-monitor
  namespace: project
  labels:
    release: prom
spec:
  selector:
    matchLabels:
      app: todo-app
  namespaceSelector:
    matchNames:
      - project
  endpoints:
  - port: http
    interval: 15s
    path: /metrics
