apiVersion: v1
kind: ConfigMap
metadata:
  name: kiali
  namespace: istio-system
data:
  config.yaml: |
    spec:
      deployment:
        accessible_namespaces: ["default"]
      server:
        web_root: /
      login:
        token:
          signing_key: "CHANGE_ME_TO_SOMETHING_RANDOM"
    server:
      port: 20001
    auth:
      strategy: "anonymous"
    kiali_feature_flags:
      certificates_information_indicators:
        enabled: true
    external_services:
      prometheus:
        enabled: true
        url: http://prom-prometheus-server.monitoring.svc.cluster.local:80
      istio:
        root_namespace: istio-system
