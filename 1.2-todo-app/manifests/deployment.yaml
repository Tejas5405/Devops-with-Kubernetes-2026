apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: image-cache-pvc
      containers:
        - name: todo-app
          image: PROJECT/IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: CACHE_DIR
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: CACHE_DIR
            - name: CACHE_TTL_MS
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: CACHE_TTL_MS
            - name: IMAGE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: IMAGE_URL
            - name: TODO_BACKEND_URL
              value: "http://todo-backend-svc.project.svc.cluster.local:3000/todos"
            - name: NATS_URL
              value: "nats://my-nats.nats.svc.cluster.local:4222"
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: image-cache
              mountPath: /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
