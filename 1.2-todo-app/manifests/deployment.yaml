apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: image-cache-pvc
      containers:
        - name: todo-app
          image: todo-app:1.13
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: CACHE_DIR
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: CACHE_DIR
            - name: CACHE_TTL_MS
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: CACHE_TTL_MS
            - name: IMAGE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: IMAGE_URL
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: image-cache
              mountPath: /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
