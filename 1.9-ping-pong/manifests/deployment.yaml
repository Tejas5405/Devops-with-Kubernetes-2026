apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: ping-pong:1.12
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: PG_HOST
              value: "postgres-svc.exercises.svc.cluster.local"
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              value: "postgres"
            - name: PG_PASSWORD
              value: "example"
            - name: PG_DATABASE
              value: "postgres"
          ports:
            - containerPort: 3000
          securityContext:
            runAsUser: 0
            runAsGroup: 0
