apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: course-storage
          persistentVolumeClaim:
            claimName: course-pvc
      containers:
        - name: ping-pong
          image: ping-pong:1.11
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: course-storage
              mountPath: /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
