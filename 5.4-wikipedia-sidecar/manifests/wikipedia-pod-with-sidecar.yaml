apiVersion: v1
kind: Pod
metadata:
  name: wikipedia-pod-with-sidecar
  namespace: default
spec:
  volumes:
    - name: www-data
      emptyDir: {}
  initContainers:
    - name: wiki-init
      image: curlimages/curl:latest
      volumeMounts:
        - name: www-data
          mountPath: /usr/share/nginx/html
      command:
        - sh
        - -c
        - |
          curl -sL https://en.wikipedia.org/wiki/Kubernetes > /usr/share/nginx/html/index.html
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: www-data
          mountPath: /usr/share/nginx/html
    - name: wiki-sidecar
      image: curlimages/curl:latest
      volumeMounts:
        - name: www-data
          mountPath: /usr/share/nginx/html
      command:
        - sh
        - -c
        - |
          while true; do
            SLEEP=$(( (RANDOM % 600) + 300 ))
            sleep $SLEEP
            curl -sL https://en.wikipedia.org/wiki/Special:Random > /usr/share/nginx/html/index.html
          done
  restartPolicy: Never
