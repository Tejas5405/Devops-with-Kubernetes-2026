name: GitOps - Project

on:
  push:
    paths:
      - '1.2-todo-app/**'

jobs:
  build-publish-release:
    name: Build, Push and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish backend
        run: |-
          docker build --tag "todo-app:${{ github.sha }}" ./1.2-todo-app
          docker push "todo-app:${{ github.sha }}"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        working-directory: ./1.2-todo-app
        run: kustomize edit set image PROJECT/IMAGE=todo-app:${{ github.sha }}

      - name: Commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: '1.2-todo-app/kustomization.yaml'
          message: 'chore: release todo-app ${{ github.sha }}'
