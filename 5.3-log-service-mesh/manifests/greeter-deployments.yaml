apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-dep-v1
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v1
  template:
    metadata:
      labels:
        app: greeter
        version: v1
    spec:
      containers:
        - name: greeter
          image: greeter:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: GREETING
              value: "Hello from greeter v1"
          ports:
            - containerPort: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-v1
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: greeter
    version: v1
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000

---

