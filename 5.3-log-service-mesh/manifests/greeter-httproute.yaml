apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: greeter
  namespace: default
spec:
  parentRefs:
  - name: hello-gateway
    namespace: default
  rules:
  - matches:
    - path:
        type: Exact
        value: /greet
    backendRefs:
    - name: greeter-svc-v1
      port: 3000
      weight: 75
    - name: greeter-svc-v2
      port: 3000
      weight: 25
