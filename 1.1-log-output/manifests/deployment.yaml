apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: course-storage
          persistentVolumeClaim:
            claimName: course-pvc
      containers:
        - name: log-output
          image: log-output:1.11
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: course-storage
              mountPath: /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
