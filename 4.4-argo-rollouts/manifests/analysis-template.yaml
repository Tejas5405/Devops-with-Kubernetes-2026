apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: todo-app-success-rate
  namespace: project
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 1m
      successCondition: result[0] >= 0.95
      failureLimit: 3
      provider:
        prometheus:
          address: http://prom-prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            1 - sum(rate(http_requests_total{namespace="project",app="todo-app"}[5m])) / sum(rate(http_requests_total{namespace="project",app="todo-app"}[5m]))
